name: 'build-release'

# Builds the host and the remote for Windows, Linux and macOS, packs them with
# Velopack and attaches everything to a draft release `ui-<version>`. The
# version is the one in sbsp_ui/Cargo.toml (see scripts/pack.py).
#
# Publishing the release (not a draft any more) runs `deploy-update`, which
# puts the update feed on GitHub Pages.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  # Where the apps look for updates (`<base>/host`, `<base>/remote`).
  # Changing the host of the feed means changing this and `deploy-update`.
  SBSP_UPDATE_BASE_URL: https://keinsleif.github.io/sbsp/update

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - id: version
        run: |
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' sbsp_ui/Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: create the draft release
        run: |
          gh release view "ui-${{ steps.version.outputs.version }}" >/dev/null 2>&1 \
            || gh release create "ui-${{ steps.version.outputs.version }}" \
              --draft --target "$GITHUB_SHA" \
              --title "SBS Player v${{ steps.version.outputs.version }}" \
              --notes "See the assets to download this version and install."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The browser build; the host embeds it (sbsp_ui/web_dist).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main

      - run: cargo binstall trunk@0.21 --no-confirm
      - run: pip install fonttools brotli

      - name: build the web app
        working-directory: sbsp_ui
        run: trunk build --release
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: z

      - uses: actions/upload-artifact@v4
        with:
          name: web_dist
          path: sbsp_ui/web_dist
          if-no-files-found: error

  build:
    needs: [prepare, web]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    env:
      # Signing is on when these are set (scripts/pack.py); unset, nothing is signed.
      SBSP_WIN_SIGN_PARAMS: ${{ secrets.SBSP_WIN_SIGN_PARAMS }}
      SBSP_WIN_SIGN_TEMPLATE: ${{ secrets.SBSP_WIN_SIGN_TEMPLATE }}
      SBSP_MAC_SIGN_APP_IDENTITY: ${{ secrets.SBSP_MAC_SIGN_APP_IDENTITY }}
      SBSP_MAC_SIGN_INSTALL_IDENTITY: ${{ secrets.SBSP_MAC_SIGN_INSTALL_IDENTITY }}
      SBSP_MAC_NOTARY_PROFILE: ${{ secrets.SBSP_MAC_NOTARY_PROFILE }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: web_dist
          path: sbsp_ui/web_dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libgtk-3-dev libxdo-dev

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet tool install -g vpk

      - name: build (Windows, Linux)
        if: matrix.platform != 'macos-latest'
        run: |
          cargo build --release --no-default-features --features host --bin sbsp_host
          cargo build --release --no-default-features --features remote --bin sbsp_remote

      - name: build (macOS, universal)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p target/universal
          for app in host remote; do
            for triple in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release --target $triple --no-default-features --features $app --bin sbsp_$app
            done
            lipo -create -output target/universal/sbsp_$app \
              target/aarch64-apple-darwin/release/sbsp_$app \
              target/x86_64-apple-darwin/release/sbsp_$app
          done
          echo "SBSP_BIN_DIR=target/universal" >> "$GITHUB_ENV"

      - name: pack
        run: |
          for app in host remote; do
            SBSP_FEED_URL="$SBSP_UPDATE_BASE_URL/$app" python scripts/pack.py $app
          done

      # The feed's index files have the same names in the two apps, so they
      # go up with the name of the app in front. The rest is named after the
      # package already.
      - name: attach to the release
        run: |
          for app in host remote; do
            for file in target/releases/$app/*; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              case "$name" in
                releases.*|RELEASES*) cp "$file" "target/upload-$app.$name"; file="target/upload-$app.$name" ;;
              esac
              gh release upload "ui-${{ needs.prepare.outputs.version }}" "$file" --clobber
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
