name: 'check-license-notices'

on:
  pull_request:
    branches: [dev]
    paths:
      - 'Cargo.lock'
      - 'THIRD_PARTY_NOTICES.md'
      - 'about.hbs'
      - 'about.toml'
      - .github/workflows/check-license-notices.yml
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: read
    env:
      MISE_ENV: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: cargo-bins/cargo-binstall@main
      - uses: jdx/mise-action@v4
        with:
          install_args: rust cargo:cargo-about

      - name: Generate notices
        run: |
          mise generate_notices

      - name: Verify no changes
        run: |
          if ! git diff --exit-code THIRD_PARTY_NOTICES.md; then
            echo "::error::THIRD_PARTY_NOTICES.md is not latest. please update via mise generate_notices manually."
            exit 1
          fi
