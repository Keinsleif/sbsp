name: 'deploy-update'

# Puts the update feed of a published release on GitHub Pages:
# `update/` (what the apps look at): the packages and the index files of the
# release. The files of both apps sit side by side, told apart by the channel
# in their names (`releases.host-win.json`, `...-remote-osx-full.nupkg`). The
# feed of the Tauri versions (`update/latest-*.json`) stays where it is.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target Release Tag'
        required: true
        type: string
        default: 'ui-3.0.0'

jobs:
  upload:
    if: startsWith(github.event.inputs.tag_name || github.event.release.tag_name, 'ui-')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: collect the feed
        run: |
          tag="${{ github.event.inputs.tag_name || github.event.release.tag_name }}"
          mkdir -p upload
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir upload \
            --pattern '*.nupkg' --pattern 'releases.*'
          ls -R upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./upload
          destination_dir: update
          keep_files: true
