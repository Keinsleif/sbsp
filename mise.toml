[tools]
node = "24"
pnpm = "12"
rust = "stable"
"cargo:tauri-cli" = { version = "2", depends = ["rust"] }
"cargo:cargo-about" = { version = "0.9", depends = ["rust"] }
"cargo:cargo-edit" = { version = "0.13", depends = ["rust"] }
"cargo:cargo-packager" = { version = "0.11", depends = ["rust"] }
cocogitto = "7"
cmake = "4"
"cargo:trunk" = { version = "0.21", depends = ["rust"] }
"python" = "3.15"
"uv" = "latest"
"pipx:fonttools" = "4"
mold = { version = "latest", os = ["linux"]}

[tasks.generate_notices]
run = [
'cargo about generate about.hbs --workspace -o THIRD_PARTY_NOTICES.md',
'cd ./sbsp_frontend && pnpm exec license-checker-rseidelsohn --excludePackages sbsp_frontend --direct false --production --json --out ../scripts/tmp.json',
'cd ./scripts && node notice_json2md.js',
'rm ./scripts/tmp.json',
]

# The browser build, then the host (which embeds it).
[tasks.build_web]
dir = "sbsp_ui"
# Size over speed for the wasm: cargo's own override of the release profile,
# which affects only this build.
env = { CARGO_PROFILE_RELEASE_OPT_LEVEL = "z" }
run = 'trunk build --release'

[tasks.build_host]
depends = ["build_web"]
run = 'cargo build --profile release --no-default-features --features host --bin sbsp_host'

[settings]
cargo.binstall_quickinstall = true
