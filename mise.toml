[tools]
rust = "stable"
node = "24"
pnpm = "12"
cocogitto = "7"
cmake = "4"
"cargo:tauri-cli" = "2"
"cargo:cargo-about" = "0.9"
"cargo:cargo-edit" = "0.13"
"cargo:trunk" = "0.21"
"python" = "3.15"
"uv" = "latest"
dotnet = "8"
"dotnet:vpk" = "latest"
mold = { version = "latest", os = ["linux"] }

[bootstrap.packages]
"apt:squashfs-tools" = "latest"
"dnf:squashfs-tools" = "latest"
"pacman:squashfs-tools" = "latest"

[tasks.generate_notices]
run = [
'cargo about generate about.hbs --workspace -o THIRD_PARTY_NOTICES.md',
'cd ./sbsp_frontend && pnpm exec license-checker-rseidelsohn --excludePackages sbsp_frontend --direct false --production --json --out ../scripts/tmp.json',
'cd ./scripts && node notice_json2md.js',
'rm ./scripts/tmp.json',
]

# The browser build, then the host (which embeds it).
[tasks.build_web]
dir = "sbsp_ui"
# Size over speed for the wasm: cargo's own override of the release profile,
# which affects only this build.
env = { CARGO_PROFILE_RELEASE_OPT_LEVEL = "z" }
run = 'trunk build --release'

[tasks.build_host]
depends = ["build_web"]
run = 'cargo build -p sbsp_ui --profile release --no-default-features --features host --bin sbsp_host'

[tasks.build_remote]
run = 'cargo build -p sbsp_ui --profile release --no-default-features --features remote --bin sbsp_remote'

# Packages. `vpk` (Velopack's CLI, `dotnet tool install -g vpk`, needs the
# .NET 8 SDK) makes the installers and the update feed; see scripts/pack.py.
[tasks.pack_host]
depends = ["build_host"]
run = 'python scripts/pack.py host'

[tasks.pack_remote]
depends = ["build_remote"]
run = 'python scripts/pack.py remote'

[settings]
cargo.binstall_quickinstall = true
