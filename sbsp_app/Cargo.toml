[package]
name = "sbsp_app"
description = "A SBS Player Frontend App powered by tauri."
version = "2.7.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sbsp_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true
sbsp_backend = { path = "../sbsp_backend", features = ["type_export"], default-features = false }
sbsp_frontend_settings = { path = "../sbsp_frontend_settings", features = ["type_export"], default-features = false }
sbsp_license = { path = "../sbsp_license", features = ["type_export"], default-features = false }

[dependencies]
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-os.workspace = true
tauri-plugin-opener.workspace = true
humantime.workspace = true
serde.workspace = true
serde_json.workspace = true

sbsp_backend = { path = "../sbsp_backend", features = ["server"] }
sbsp_frontend_settings = { path = "../sbsp_frontend_settings" }
sbsp_license = { path = "../sbsp_license" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "fs"] }
log.workspace = true
anyhow.workspace = true
tower-http = { version = "0.6", features = ["fs"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater.workspace = true
tauri-plugin-window-state.workspace = true
