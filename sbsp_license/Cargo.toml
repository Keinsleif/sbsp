[package]
name = "sbsp_license"
version = "0.1.1"
description = "A license management library & toolkit for SBS Player."
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "gen_license"
path = "src/main.rs"
required-features = ["clap"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["serde", "v4"] }

anyhow = { workspace = true, optional = true }
ed25519-dalek = { version = "3.0", features = ["pem"], optional = true }
base64 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

clap = { workspace = true, optional = true }

ts-rs = { workspace = true, features = ["uuid-impl"], optional = true }

[features]
default = ["manager"]
manager = ["dep:anyhow", "dep:ed25519-dalek", "dep:base64", "dep:serde_json"]
type_export = ["dep:ts-rs"]
clap = ["dep:clap"]
