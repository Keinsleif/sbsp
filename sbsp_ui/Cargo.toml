[package]
name = "sbsp_ui"
description = "SBSP iced UI (host / remote / web)"
version = "3.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
host = ["iced/tokio", "dep:tokio", "sbsp_backend/server", "dep:tempfile", "dep:keepawake", "dep:muda", "dep:rfd", "dep:sbsp_license", "dep:axum", "dep:velopack"]
remote = ["iced/tokio", "dep:tokio", "sbsp_backend/client", "dep:tempfile", "dep:keepawake", "dep:rfd", "dep:velopack"]
web = ["sbsp_backend/protocol", "iced/webgl", "rust-embed/debug-embed"]

[[bin]]
name = "sbsp_host"
path = "src/bin/sbsp_host.rs"
required-features = ["host"]

[[bin]]
name = "sbsp_remote"
path = "src/bin/sbsp_remote.rs"
required-features = ["remote"]

[[bin]]
name = "sbsp_web"
path = "src/bin/sbsp_web.rs"
required-features = ["web"]

[dependencies]
sbsp_backend = { path = "../sbsp_backend", default-features = false, features = ["protocol"] }
anyhow = { version = "1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

iced = { version = "0.14", features = ["canvas", "image", "svg", "markdown", "qr_code", "advanced"] }
iced_aw = { version = "0.14", default-features = false, features = ["context_menu", "menu", "spinner"] }
iced_futures = "0.14"
dark-light = "2"

# Wall clock in the header. `clock` is what provides `Local::now()`.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
unic-langid = { version = "0.9", features = ["macros"] }
log = { workspace = true }
# Atomic writes of the settings files (host and remote).
tempfile = { workspace = true, optional = true }
# Keeps the machine awake while a show is run (host and remote).
keepawake = { version = "0.6", optional = true }

tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "fs"], optional = true }
rfd = { version = "0.16", optional = true }
velopack = { version = "1", optional = true }
axum = { version = "0.8", default-features = false, optional = true }
sbsp_license = { path = "../sbsp_license", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { version = "0.14", default-features = false, features = ["tokio"] }
fern = "0.7"
humantime = { workspace = true }
dirs = "5"
opener = "0.8"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6", default-features = false, features = ["websocket", "http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"
wasmtimer = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage"] }
i18n-embed = { version = "0.16", features = ["fluent-system", "web-sys-requester"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

[dev-dependencies]
iced_test = "0.14"
serial_test = "3"
indexmap = { version = "2", features = ["serde"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
