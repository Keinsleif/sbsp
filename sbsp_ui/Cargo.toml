[package]
name = "sbsp_ui"
description = "SBSP iced UI (host / remote / web)"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
host = ["iced/tokio", "dep:tokio", "sbsp_backend/server", "sbsp_frontend_settings/manager", "dep:muda", "dep:rfd", "dep:sbsp_license"]
remote = ["iced/tokio", "dep:tokio", "sbsp_backend/client", "sbsp_frontend_settings/manager"]
web = ["sbsp_backend/protocol", "iced/webgl", "rust-embed/debug-embed"]

[[bin]]
name = "sbsp_host"
path = "src/bin/sbsp_host.rs"
required-features = ["host"]

[[bin]]
name = "sbsp_remote"
path = "src/bin/sbsp_remote.rs"
required-features = ["remote"]

[[bin]]
name = "sbsp_web"
path = "src/bin/sbsp_web.rs"
required-features = ["web"]

[dependencies]
sbsp_backend = { path = "../sbsp_backend", default-features = false, features = ["protocol"] }
sbsp_frontend_settings = { path = "../sbsp_frontend_settings", default-features = false }
anyhow = { version = "1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

iced = { version = "0.14", features = ["canvas", "image", "svg", "markdown", "qr_code", "advanced"] }
iced_aw = { version = "0.14", default-features = false, features = ["context_menu", "menu", "spinner"] }
iced_futures = "0.14"
dark-light = "2"
# Wall clock in the header. Already in the workspace's lockfile (pulled in
# transitively); `clock` is what provides `Local::now()`.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
unic-langid = { version = "0.9", features = ["macros"] }
log = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "fs"], optional = true }
# Native file dialogs (host only). Already in the lockfile via the Tauri
# dialog plugin; Phase 7 uses it for the real file operations.
rfd = { version = "0.16", optional = true }
# License verification and the license types (host only).
sbsp_license = { path = "../sbsp_license", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Only pulled in when the `host` feature enables it (macOS global menu bar).
# See src/host/native_menu.rs and the migration plan, section 5.1.
muda = { version = "0.17", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { version = "0.14", default-features = false, features = ["tokio"] }
# stderr logging for the host/remote binaries (see src/logging.rs). Not
# useful on wasm32 -- stdio isn't connected to the browser console there,
# and Phase 9's web target will want its own console_log-based setup.
fern = "0.7"
humantime = { workspace = true }
dirs = "5"
# Opens the log folder in the file manager ("Show Log Files").
opener = "0.8"
# The OS UI language, for a language setting left on "system".
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's language, for a language setting left on "system".
i18n-embed = { version = "0.16", features = ["fluent-system", "web-sys-requester"] }
# Local::now() on wasm reads the browser's clock through wasm-bindgen.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

[dev-dependencies]
# Headless UI testing (see migration plan, section 8/"iced_test による
# テスト基盤"). Only used by #[cfg(test)] code, so a plain dev-dependency
# rather than target-gated like the items above.
iced_test = "0.14"
# Forces every #[serial]-tagged test below to run one at a time rather
# than cargo test's default parallel-by-thread execution. Needed because
# i18n::LOADER is one process-wide static shared by every test in this
# binary: a test that calls i18n::select (or otherwise depends on which
# language is currently loaded) races any other such test running
# concurrently on a different thread.
serial_test = "3"
indexmap = { version = "2", features = ["serde"] }
