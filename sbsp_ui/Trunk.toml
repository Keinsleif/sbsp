# The browser build: `trunk build --release` from here (see the mise task
# `build_web`). The fonts are cut down first (scripts/subset_fonts.py) and
# copied next to the page; the host embeds the result (web_dist/).
[build]
target = "index.html"
dist = "web_dist"
public_url = "/"

# What the build itself writes must not start another build.
[watch]
ignore = ["web/fonts", "web_dist"]

[[hooks]]
stage = "pre_build"
command = "uv"
command_arguments = ["run", "--script", "../scripts/subset_fonts.py"]
