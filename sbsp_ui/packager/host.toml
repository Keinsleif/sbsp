product-name = "SBS Player"
identifier = "com.keinsleif.sbsp"
version = "0.1.0"
out-dir = "../target/packages/host"

binaries = [
  { path = "../target/release/sbsp_host", main = true },
]

description = "A SBS Player Frontend App powered by iced."
copyright = "© 2025 Keinsleif"
publisher = "Keinsleif"
category = "Music"

icons = [
  "assets/icons/32x32.png",
  "assets/icons/128x128.png",
  "assets/icons/128x128@2x.png",
  "assets/icons/icon.icns",
  "assets/icons/icon.ico",
]

resources = [
  { src = "../THIRD_PARTY_NOTICES.md", target = "THIRD_PARTY_NOTICES.md" },
]

formats = ["deb", "appimage", "nsis", "dmg", "app"]

[nsis]
installer-icon = "assets/icons/icon.ico"
languages = ["English", "Japanese"]
